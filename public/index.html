<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Workout Logbook</title>
  <meta name="description" content="Track every set, rep and weight, plus cardio and stomach vacuum sessions.">
  <meta name="theme-color" content="#f6f7f9" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0f1115" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Logbook">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <header class="topbar">
    <button class="brand" type="button" data-action="go-home" aria-label="Logbook: go to today's log">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10h2v4H3zM19 10h2v4h-2zM6 7h2v10H6zM16 7h2v10h-2zM8 11h8v2H8z" fill="currentColor"/></svg>
      <span>Logbook</span>
    </button>
    <button class="sync" id="sync" type="button" data-action="sync-now" title="Sync status">
      <i class="dot"></i><span id="sync-label">Local</span>
    </button>
  </header>

  <div id="ptr" class="ptr" aria-hidden="true"><span class="ptr-icon"><svg viewBox="0 0 24 24"><path d="M17.65 6.35A7.96 7.96 0 0 0 12 4a8 8 0 1 0 7.73 10h-2.08A6 6 0 1 1 12 6c1.66 0 3.14.69 4.22 1.78L13 11h7V4z" fill="currentColor"/></svg></span><span class="ptr-text">Pull to sync</span></div>

  <nav class="tabbar" aria-label="Sections">
    <button type="button" data-action="tab" data-tab="log">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3v2H5a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2V3h-2v2H9V3zm-2 7h14v9H5z" fill="currentColor"/></svg>
      <span>Log</span>
    </button>
    <button type="button" data-action="tab" data-tab="plan">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v2H4zm0 6h16v2H4zm0 6h10v2H4z" fill="currentColor"/></svg>
      <span>Plan</span>
    </button>
    <button type="button" data-action="tab" data-tab="progress">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 19h18v2H3zM5 11h3v6H5zm5-4h3v10h-3zm5 6h3v4h-3z" fill="currentColor"/></svg>
      <span>Progress</span>
    </button>
    <button type="button" data-action="tab" data-tab="settings">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 8.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7zm8.4 4.6.1-1.1-.1-1.1 2-1.6-2-3.4-2.4 1a8 8 0 0 0-1.9-1.1L15.7 3h-3.9l-.4 2.6a8 8 0 0 0-1.9 1.1l-2.4-1-2 3.4 2 1.6L7 12l.1 1.1-2 1.6 2 3.4 2.4-1c.6.5 1.2.8 1.9 1.1l.4 2.6h3.9l.4-2.6c.7-.3 1.3-.6 1.9-1.1l2.4 1 2-3.4z" fill="currentColor"/></svg>
      <span>Settings</span>
    </button>
  </nav>

  <main id="view" class="view" tabindex="-1"></main>

  <div id="sheet" class="sheet" hidden>
    <div class="sheet-backdrop" data-action="close-sheet"></div>
    <div class="sheet-panel" role="dialog" aria-modal="true" aria-labelledby="sheet-title"></div>
  </div>
  <div id="rest" class="restbar" role="timer" aria-live="off" hidden></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <div id="tooltip" class="tooltip" hidden></div>

  <noscript>This app needs JavaScript enabled.</noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
